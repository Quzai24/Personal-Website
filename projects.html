<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/projects.css" />
    <link rel="icon" type="image/x-icon" href="/source_images/me.PNG" />
    <title>My Projects</title>
  </head>
  <body>
    <div class="page">
      <div class="header row">
        <div class="title col-11">
          <h1>My Projects</h1>
        </div>
        <div class="home col-1">
          <a href="./index.html" aria-label="Home">
            <img class="home-image" src="./source_images/home.svg" alt="Home" />
          </a>
        </div>
      </div>
      <div class="page-content row">
        <div id="waves-animation" class="spacer col-2">
          <div class="wave one"></div>
          <div class="wave two"></div>
          <div class="wave three"></div>
          <div class="wave four"></div>
        </div>
        <div class="col-4">
          <div class="project-container">
            <a href="https://rynvarai.itch.io/eciton-empire"
              ><img
                class="project-pic"
                src="./source_images/Player_Animations.gif"
                alt="Player Character Walking Foward"
            /></a>
          </div>
          <h2 class="project-title">Eciton Empire</h2>
          <div class="project-container">
            <a href="https://github.com/Quzai24/NodeNews"
              ><img
                class="project-pic"
                src="./source_images/nodenews.png"
                alt="Dashboard of Node News"
            /></a>
          </div>
          <h2 class="project-title">Node News</h2>
        </div>
        <div class="col-4">
          <div class="project-container">
            <a href="https://github.com/Quzai24/Lights-Out"
              ><img
                class="project-pic"
                src="./source_images/Lights_Out.png"
                alt="Lights Out Game"
            /></a>
          </div>
          <h2 class="project-title">Lights Out</h2>
          <div class="project-container">
            <a href="https://github.com/nish-naravarajula/FocusFlow"
              ><img
                class="project-pic"
                src="./source_images/Focus Flow.png"
                alt="A drawing of Passenger Pigeon with a little hat and a rose"
            /></a>
          </div>
          <h2 class="project-title">Focus Flow</h2>
        </div>
        <div id="waves-animation right-side" class="spacer col-2">
          <div class="wave one right"></div>
          <div class="wave two right"></div>
          <div class="wave three right"></div>
          <div class="wave four right"></div>
        </div>
      </div>
    </div>
  </body>
</html>
